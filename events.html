    <script src="./js/site.js" defer></script>
    <script>
        (function () {
            var API = 'https://app.bizcelona.com/api/events/public';
            var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            var list = document.getElementById('events-list');

            function esc(str) {
                var d = document.createElement('div');
                d.appendChild(document.createTextNode(str == null ? '' : String(str)));
                return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            function pad(n) { return n < 10 ? '0' + n : String(n); }

            // Returns {date, time}; time is empty when the event has no real start time.
            function formatWhen(value) {
                var d = new Date(value);
                if (isNaN(d.getTime())) return { date: esc(value), time: '' };
                var date = DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
                var h = d.getUTCHours(), m = d.getUTCMinutes();
                return { date: date, time: (h === 0 && m === 0) ? '' : pad(h) + ':' + pad(m) };
            }

            function empty(message) {
                list.innerHTML =
                    '<div class="empty-state">' +
                    '<h2>' + message + '</h2>' +
                    '<p class="muted measure">We hold a co-working day every two weeks and one quality event a month. Dates appear here as soon as they are confirmed.</p>' +
                    '<div class="btn-row"><a class="btn btn-dark" href="index.html#apply">Apply to join</a></div>' +
                    '</div>';
            }

            function render(events) {
                if (!events || !events.length) { empty('No dates published yet.'); return; }
                list.innerHTML = events.map(function (ev) {
                    var when = formatWhen(ev.event_date);
                    var url = String(ev.external_url || '');
                    var safe = /^https?:\/\//i.test(url) ? url : '';
                    return '<article class="event-card">' +
                        '<p class="event-date">' + when.date +
                        (when.time ? '<span class="event-time">' + esc(when.time) + '</span>' : '') + '</p>' +
                        '<div class="event-body">' +
                        (ev.category ? '<span class="cat">' + esc(ev.category) + '</span>' : '') +
                        '<h2>' + esc(ev.title) + '</h2>' +
                        (ev.location ? '<p class="event-meta">' + esc(ev.location) + '</p>' : '') +
                        (safe ? '<a class="btn btn-primary" href="' + esc(safe) + '" target="_blank" rel="noopener noreferrer">RSVP</a>' : '') +
                        '</div></article>';
                }).join('');
            }

            fetch(API)
                .then(function (r) { if (!r.ok) throw new Error('API ' + r.status); return r.json(); })
                .then(function (data) { render(data.data || []); })
                .catch(function (e) {
                    console.error('Events load failed:', e);
                    empty('We could not load the events just now.');
                })
                .then(function () { list.setAttribute('aria-busy', 'false'); });
        })();
    </script>
</body>
